name: Publish Architect Flows (main → PROD)

on:
  push:
    branches: [ main ]
    paths:
      - 'Flows/**'
  workflow_dispatch:

jobs:
  publish-prod:
    runs-on: ubuntu-latest
    env:
      ARCHY_VERSION: "latest"
      FLOWS_DIR: "Flows"
      PROD_LOCATION: "usw2.pure.cloud"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REQUIRED to compare commits

      - name: Setup Archy
        uses: stsmdt/setup-genesyscloud-archy@v1
        with:
          archy-version: ${{ env.ARCHY_VERSION }}

      - name: Export PROD credentials
        run: |
          echo "CLIENT_ID=${{ secrets.PROD_CLIENT_ID }}" >> $GITHUB_ENV
          echo "CLIENT_SECRET=${{ secrets.PROD_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "LOCATION=${{ env.PROD_LOCATION }}" >> $GITHUB_ENV

      - name: Detect changed flows
        id: changed-flows
        run: |
          set -e
          git fetch origin main

          # Get changed YAML files under flows/
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD \
            | grep '^Flows/.*\.yaml$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No flow changes detected."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed flow files:"
          echo "$CHANGED_FILES"

          # Save as space-separated list
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "files=$(echo $CHANGED_FILES | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Publish changed flows to PROD
        if: steps.changed-flows.outputs.changed == 'true'
        run: |
          set -e
          for f in ${{ steps.changed-flows.outputs.files }}; do
            echo "Publishing: $f"
            archy publish \
              --file "$f" \
              --location "$LOCATION" \
              --clientId "$CLIENT_ID" \
              --clientSecret "$CLIENT_SECRET"
          done

      - name: Summary
        run: echo "Published only changed flows to PROD ($LOCATION)."
